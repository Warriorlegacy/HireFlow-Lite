                "@type": "Question",
                "name": "Who is HireFlow Lite for?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Startups and boutique recruiters hiring a handful of roles at a time. It is deliberately smaller than an enterprise HRIS: publication, application intake, a transparent pipeline, interviews, scorecards, and candidate status."
                }
              },
              {
                "@type": "Question",
                "name": "Can an interviewer see every candidate?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Interviewers only receive the packet for interviews they are assigned to, with the candidate fields needed for that conversation. They cannot browse the pipeline, read other interviews, or see internal feedback."
                }
              },
              {
                "@type": "Question",
                "name": "Does HireFlow Lite rank or reject candidates automatically?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. There is no automated ranking, scoring, or rejection path. Scorecards require a human interviewer, AI assistance is off by default, and every stage change records who made it and why."
                }
              },
              {
                "@type": "Question",
                "name": "How are resumes protected?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Resumes are never public. Uploads are validated by file signature, stored privately, and served only through authenticated, permission-checked downloads that are written to the audit log."
                }
              }
            ]
