<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="HireFlow Lite — a hiring desk, not a funnel">
  <rect width="1200" height="630" fill="#f7f5f0"/>
  <rect x="0" y="0" width="1200" height="8" fill="#1d4d3b"/>
  <g transform="translate(72 64)">
    <rect width="44" height="44" rx="10" fill="#1d4d3b"/>
    <path d="M14 31V13h4.2v7.4h7.6V13H30v18h-4.2v-7.2h-7.6V31H14Z" fill="#f7f5f0"/>
    <text x="58" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1b1a17">HireFlow <tspan fill="#5c5a53">Lite</tspan></text>
  </g>

  <text x="72" y="234" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#1b1a17">A hiring desk,</text>
  <text x="72" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#1b1a17">not a funnel.</text>
  <text x="74" y="362" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#4c4a44">Applicant tracking for small teams: a readable pipeline,</text>
  <text x="74" y="394" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#4c4a44">immutable stage history, and a clear answer for every candidate.</text>

  <g transform="translate(74 448)">
    <rect width="196" height="44" rx="6" fill="#1d4d3b"/>
    <text x="98" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fffefb">hireflow-lite</text>
    <text x="222" y="28" font-family="'Courier New', monospace" font-size="15" fill="#8a877d">privacy-conscious · no auto-rejection</text>
  </g>

  <g transform="translate(760 118)">
    <rect width="368" height="396" rx="12" fill="#fffefb" stroke="#e3ded2"/>
    <rect width="368" height="40" rx="12" fill="#f1ede3"/>
    <circle cx="18" cy="20" r="4" fill="#e3ded2"/>
    <circle cx="32" cy="20" r="4" fill="#e3ded2"/>
    <circle cx="46" cy="20" r="4" fill="#e3ded2"/>
    <text x="64" y="25" font-family="'Courier New', monospace" font-size="11" fill="#8a877d">senior product designer · pipeline</text>

    <g transform="translate(20 64)">
      <rect width="104" height="290" rx="8" fill="#f4f1e9" stroke="#e3ded2"/>
      <text x="12" y="22" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c4a44">New</text>
      <g transform="translate(8 34)">
        <rect width="88" height="62" rx="5" fill="#fffefb" stroke="#e3ded2"/>
        <text x="10" y="22" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1b1a17">Hugo Silva</text>
        <text x="10" y="38" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8a877d">applied 2h ago</text>
        <text x="10" y="52" font-family="'Courier New', monospace" font-size="8" fill="#1d4d3b">careers page</text>
      </g>
      <g transform="translate(8 102)">
        <rect width="88" height="62" rx="5" fill="#fffefb" stroke="#e3ded2"/>
        <text x="10" y="22" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1b1a17">Ira Banerjee</text>
        <text x="10" y="38" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8a877d">referred by Sam</text>
        <text x="10" y="52" font-family="'Courier New', monospace" font-size="8" fill="#1d4d3b">referral</text>
      </g>
    </g>

    <g transform="translate(132 64)">
      <rect width="104" height="290" rx="8" fill="#f4f1e9" stroke="#e3ded2"/>
      <text x="12" y="22" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c4a44">Interview</text>
      <g transform="translate(8 34)">
        <rect width="88" height="62" rx="5" fill="#fffefb" stroke="#1d4d3b"/>
        <text x="10" y="22" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1b1a17">Maya Krishnan</text>
        <text x="10" y="38" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8a877d">craft · 18 Nov</text>
        <text x="10" y="52" font-family="'Courier New', monospace" font-size="8" fill="#1d4d3b">interview</text>
      </g>
    </g>

    <g transform="translate(244 64)">
      <rect width="104" height="290" rx="8" fill="#f4f1e9" stroke="#e3ded2"/>
      <text x="12" y="22" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c4a44">Offer</text>
      <g transform="translate(8 34)">
        <rect width="88" height="62" rx="5" fill="#fffefb" stroke="#e3ded2"/>
        <text x="10" y="22" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1b1a17">Lena Fischer</text>
        <text x="10" y="38" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8a877d">offer sent</text>
        <text x="10" y="52" font-family="'Courier New', monospace" font-size="8" fill="#1d4d3b">referral</text>
      </g>
    </g>

    <g transform="translate(20 366)">
      <rect width="328" height="1" fill="#e3ded2"/>
      <text x="0" y="18" font-family="'Courier New', monospace" font-size="9" fill="#8a877d">synthetic demo data · no real candidates</text>
    </g>
  </g>
